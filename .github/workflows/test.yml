name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install: the suite is plain Node with fake HTTP
      # servers standing in for plex.tv, a Plex Media Server and Radarr.
      - name: Run tests
        run: node test/run.js

      # A syntax error in a file the tests do not load would otherwise ship.
      - name: Check every source file parses
        run: node --check shared.js && node --check background.js && node --check content.js && node --check options.js && node --check build.js

      - name: Check the manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"

      # Writes dist/chrome and dist/firefox plus a zip for each. The build
      # checks that every file the two manifests and options.html reference is
      # actually packaged, so a rename that misses one fails here instead of
      # shipping an extension that cannot start.
      - name: Build both packages
        run: node build.js

      # So a reviewer or a release can take the exact archives CI built.
      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: reelhop-packages
          path: dist/*.zip
